# Call-Tegorizer Configuration
# 모델 및 시스템 설정

# STT (Speech-to-Text) 설정
stt:
  provider: whisper  # whisper, google, azure, aws
  model_name: medium  # tiny, base, small, medium, large, large-v3
  language: ko
  device: cuda  # auto, cpu, cuda
  fp16: true
  beam_size: 1
  best_of: 1
  temperature: 0
  condition_on_previous_text: false
  task: transcribe
  vad_filter: true
  
  # 다른 STT 옵션 (provider 변경 시 활성화)
  # google:
  #   credentials_path: /path/to/credentials.json
  #   model: default
  # azure:
  #   subscription_key: YOUR_KEY
  #   region: koreacentral

# LLM (Large Language Model) 설정
llm:
  provider: ollama  # ollama, openai, anthropic, azure
  base_url: http://localhost:11434
  model: llama3.3:70b
  temperature: 0.1
  max_tokens: 2048

  # 다른 LLM 옵션 (provider 변경 시 활성화)
  # openai:
  #   api_key: YOUR_API_KEY
  #   model: gpt-4-turbo-preview
  # anthropic:
  #   api_key: YOUR_API_KEY
  #   model: claude-3-5-sonnet-20241022

# 처리 설정
processing:
  # 배치 처리
  batch_size: 10
  max_concurrent_stt: 1  # STT는 Lock으로 보호되어 순차 처리
  max_concurrent_llm: 5  # LLM은 병렬 처리 가능

  # 재시도 설정
  retry_attempts: 3
  retry_delay: 5  # seconds

  # 타임아웃
  stt_timeout: 300  # seconds (5분)
  llm_timeout: 120  # seconds (2분)

# 경로 설정
paths:
  input_dir: /home/ajung/workspace/sample_call/01/07
  output_dir: /home/ajung/workspace/sample_call/output
  categories_file: /home/ajung/workspace/call-tegorizer/categories.json
  log_dir: /home/ajung/workspace/call-tegorizer/logs

# 로깅 설정
logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  file_enabled: true
  console_enabled: true

# 대시보드 설정
dashboard:
  host: 0.0.0.0
  port: 7860
  share: false  # Gradio 공유 링크 생성 여부
  auth: null  # [username, password] 형식으로 인증 설정 가능
